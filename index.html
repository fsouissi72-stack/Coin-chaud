<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Retrouvez Coin Chaud sur Facebook et Instagram.">
  <title>Coin Chaud | Nos réseaux</title>
  <style>
    :root { --gold:#d5ad57; --gold2:#f0d99c; --black:#111; --panel:#1b1b1b; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      color:#f8f4e9; font-family:Arial,Helvetica,sans-serif;
      background: radial-gradient(ellipse at top, #292318 0%, #111 58%);
    }
    main {
      width:min(100%,440px); text-align:center; padding:36px 25px 30px;
      border:1px solid rgba(213,173,87,.65); border-radius:24px;
      background:linear-gradient(155deg,rgba(35,32,25,.98),rgba(15,15,15,.98));
      box-shadow:0 18px 55px rgba(0,0,0,.45);
    }
    .mark {
      width:78px;height:78px;margin:0 auto 16px;border:2px solid var(--gold);
      border-radius:50%;display:grid;place-items:center;color:var(--gold2);
      font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:-2px;
    }
    h1 { margin:0; color:var(--gold2); font-family:Georgia,serif; font-size:35px; letter-spacing:2px; }
    .line { width:72px;height:2px;background:var(--gold);margin:17px auto 20px; }
    p { color:#d7d0c1; line-height:1.55; margin:0 0 25px; font-size:15px; }
    .links { display:grid; gap:13px; }
    a {
      display:flex; align-items:center; justify-content:center; gap:12px;
      min-height:58px; padding:14px 18px; border-radius:12px;
      text-decoration:none; font-weight:700; letter-spacing:.2px;
      transition:transform .15s ease, filter .15s ease;
    }
    a:hover { transform:translateY(-2px); filter:brightness(1.08); }
    .facebook { background:#1877f2; color:white; }
    .instagram {
      color:white; background:linear-gradient(110deg,#833ab4,#c13584,#e1306c,#f77737);
    }
    .icon { width:22px;height:22px; flex:0 0 22px; }
    footer { color:#918a7b; font-size:11px; margin-top:25px; letter-spacing:1px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CC</div>
    <h1>COIN CHAUD</h1>
    <div class="line"></div>
    <p>Retrouvez nos produits, nos nouveautés et nos actualités sur nos réseaux sociaux.</p>
    <div class="links">
      <a class="facebook" href="https://www.facebook.com/share/19h1TqXxNG/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2V7.55c0-.93.26-1.56 1.6-1.56h1.7V3.13c-.3-.04-1.34-.13-2.55-.13-2.52 0-4.25 1.54-4.25 4.37V9.6H7.15v3.2H10V21h3.5z"/></svg>
        Suivez-nous sur Facebook
      </a>
      <a class="instagram" href="https://www.instagram.com/coin.chaud22/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Suivez-nous sur Instagram
      </a>
    </div>
    <footer>COIN CHAUD · RESTONS EN CONTACT</footer>
  </main>
</body>
</html>
